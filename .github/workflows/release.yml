name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="$(printf '%s' "${{ inputs.tag }}" | xargs)"
            if [ -z "$RAW_TAG" ]; then
              echo "::error::Tag input must not be empty."
              exit 1
            fi
            if [[ "$RAW_TAG" == v* ]]; then
              TAG="$RAW_TAG"
            else
              TAG="v${RAW_TAG}"
            fi
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi

          VERSION_NAME="${TAG#v}"
          if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          else
            VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          fi
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "SIGNING_STORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not fully configured; falling back to debug signing."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            --stacktrace

      - name: Prepare APK and checksum
        id: prepare
        shell: bash
        run: |
          SRC_APK="composeApp/build/outputs/apk/release/composeApp-release.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "::error::Expected APK not found at $SRC_APK"
            ls -la composeApp/build/outputs/apk/release/ || true
            exit 1
          fi

          mkdir -p dist
          OUT_APK="dist/SonyTimerShutter-${{ steps.version.outputs.tag }}.apk"
          cp "$SRC_APK" "$OUT_APK"
          SHA256="$(sha256sum "$OUT_APK" | awk '{print $1}')"

          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyTimerShutter-${{ steps.version.outputs.tag }}-apk
          path: ${{ steps.prepare.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SonyTimerShutter ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease != 'true' && 'true' || 'false' }}
          body: |
            - **Version**: `${{ steps.version.outputs.version_name }}` (`versionCode`: `${{ steps.version.outputs.version_code }}`)
            - **Signing**: `${{ steps.signing.outputs.mode }}`
            - **SHA-256**: `${{ steps.prepare.outputs.sha256 }}`
          files: |
            ${{ steps.prepare.outputs.apk_path }}
